# ==========================================
# WeKnora TokenDance Gateway 统一配置文件
# 所有运行参数均在此文件中集中维护
# ==========================================

# 服务监听与对外地址
server:
  port: 3002
  # 本服务对外可达的规范地址：企微登录回跳与客户端 authorize_url 拼接的唯一事实源
  # （不再信请求 Host/X-Forwarded-Host）。启动强制非空；env EXTERNAL_BASE_URL 可覆盖。
  external_base_url: "http://127.0.0.1:3002"

# 企业微信开发者凭据
wecom:
  corp_id: "ww_your_corp_id"                 # 企业ID (ww打头)
  secret: "your_app_secret"                 # 自建应用 Secret (用于换取员工登录态)
  contact_secret: "your_contact_secret"     # 通讯录管理 Secret (用于读取部门树和员工清单)
  agent_id: 1000002                         # 可选：仅在使用扫码组件时需要，普通OAuth免登不需要
  redirect_uri: "https://gateway.example.com/wecom/callback"
  insecure_skip_verify: false               # 仅调试用途：true 时跳过企微 API TLS 证书校验，默认必须保持 false

# WeKnora 平台对接配置 (与服务器运行环境完全对齐)
weknora:
  # 可留空或填 ""：留空时使用相对路径重定向，自动适配浏览器当前访问的域名和端口
  # 也可填服务名（如 http://frontend）或外网完整域名
  base_url: ""
  # 与服务器 WeKnora-app 容器的 JWT_SECRET 保持完全一致（真实值禁止入库，运行时经环境变量注入）:
  jwt_secret: "change-me-match-weknora-jwt-secret"
  root_tenant_id: 10001                      # 服务器生产全员公共空间 ID (本来生活)
  default_role: "contributor"               # 部门成员默认角色
  leader_role: "admin"                      # 部门负责人空间角色

# 数据库连接 (同一网桥下，使用容器服务名 db 直连)
database:
  host: "db"                                # Docker 内部网络服务名
  port: 5432
  user: "root"
  password: "change-me"                     # 真实密码禁止入库，运行时经环境变量注入
  dbname: "weknora"
  sslmode: "disable"

# 平台自有状态库连接 (与 WeKnora 库分离、独立账号；审计/身份/授权/同步账本均落此库)
statedb:
  host: "db"                                # Docker 内部网络服务名
  port: 5432
  user: "root"
  password: "change-me"                     # 真实密码禁止入库，运行时经 STATE_DB_PASSWORD 注入
  dbname: "weknora_gateway_state"           # 缺省 weknora_gateway_state，可经 STATE_DB_NAME 覆盖
  sslmode: "disable"

# 组织架构同步：cron 定时同步已按 INT-130/BND-130 移除（启动、登录、缓存未命中、cron
# 均不再隐式触发同步）；全量/单部门同步统一走 POST /integration/v1/admin/sync/runs
# （或 /admin/api/sync/all）手动触发。enable_cron/cron_schedule 配置项已不再生效，
# 仅保留供管理后台大盘展示历史字段，新部署不要配置。

# 管理后台 (/admin/api) 安全基线 (BND-170/171)
admin:
  key: "change-me-admin-jwt-secret"         # 管理面 HS256 JWT 密钥，与 WeKnora JWTSecret 分离（真实值禁止入库，经 PLATFORM_ADMIN_KEY 注入）
  allowed_origins: []                       # 浏览器来源白名单，如 "https://admin.example.com"；空=拒绝一切带 Origin 的管理写请求

# 集成认证接口组 (/integration/v1) 平台自有令牌体系 (INT-101)
auth:
  key: "change-me-auth-jwt-secret"          # 平台认证面 HS256 JWT 密钥，与 admin.key、weknora.jwt_secret 分离（真实值禁止入库，经 PLATFORM_AUTH_KEY 注入）

# knowledge 侧 OIDC 客户端 (/oidc/token、/oidc/userinfo)：企微 code 兑换 10min JWT，
# userinfo 返回账户中心真实 {sub, name, email}。两个字段任一为空时两个端点 501
# fail-closed（不签发任何令牌）；真实值禁止入库，经 OIDC_CLIENT_ID/OIDC_CLIENT_SECRET 注入。
oidc:
  client_id: ""
  client_secret: ""

# knowledge 兼容桥 (TASK-P09 / ADR-004)：为有效映射用户签发 ≤120s 上游个人 token
bridge:
  key: "change-me-bridge-jwt-secret"        # 桥签名密钥，生产值与 weknora.jwt_secret 同源但独立注入（经 PLATFORM_BRIDGE_KEY 覆盖），与 auth.key/admin.key 分离；启动非空校验

# WeKnora 敏感字段 AES-256-GCM 加密密钥 (32 字节)，与 WeKnora SYSTEM_AES_KEY 对齐（真实值禁止入库）
system_aes_key: "change-me-32-byte-hex-key"

# 应用部署与转技能一期配置 (纯内网 HTTP 容器部署与技能同步)
app_deploy:
  intranet_root_domain: "apps.opc.intra"          # 内网泛域名后缀 (*.apps.opc.intra 解析到 deploy-opc IP)
  caprover_url: "http://deploy.opc.intra:3000"    # deploy-opc (CapRover) 管理地址
  caprover_password: "change-me-caprover-password"# deploy-opc 管理密码
  knowledge_base_url: "http://knowledge.opc.intra:8080" # knowledge-opc API 地址
  knowledge_admin_token: "change-me-knowledge-token"     # knowledge-opc 技能 Catalog 管理 Token
  online_resources:
    - id: "shared-mysql-main"
      name: "内网公共 MySQL 8.0"
      type: "mysql"
      description: "公司内网共享 MySQL 实例 (10.10.1.21:3306)"
      env_vars:
        MYSQL_HOST: "10.10.1.21"
        MYSQL_PORT: "3306"
        MYSQL_USER: "opc_app"
        MYSQL_PASSWORD: "change-me"
        DATABASE_URL: "mysql://opc_app:change-me@10.10.1.21:3306/opc_apps"
    - id: "shared-pg-main"
      name: "内网公共 PostgreSQL 16"
      type: "postgres"
      description: "公司内网共享 PostgreSQL 实例 (10.10.1.22:5432)"
      env_vars:
        PGHOST: "10.10.1.22"
        PGPORT: "5432"
        PGUSER: "opc_app"
        PGPASSWORD: "change-me"
        PGDATABASE: "opc_apps"
        DATABASE_URL: "postgresql://opc_app:change-me@10.10.1.22:5432/opc_apps"
    - id: "shared-redis-main"
      name: "内网公共 Redis 7"
      type: "redis"
      description: "公司内网共享 Redis 缓存 (10.10.1.23:6379)"
      env_vars:
        REDIS_HOST: "10.10.1.23"
        REDIS_PORT: "6379"
        REDIS_URL: "redis://10.10.1.23:6379/0"
    - id: "shared-oss-minio"
      name: "内网公共对象存储 (MinIO/OSS)"
      type: "oss"
      description: "公司内网 S3 兼容对象存储桶 (http://10.10.1.24:9000)"
      env_vars:
        S3_ENDPOINT: "http://10.10.1.24:9000"
        S3_ACCESS_KEY: "change-me"
        S3_SECRET_KEY: "change-me"
        S3_BUCKET: "opc-apps"
